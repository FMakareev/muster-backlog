version: '3'

vars:
  APP_NAME: "muster"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'
  # Wails v3 targets GTK 4 and WebKitGTK 6.0 on Linux, which several current
  # distributions do not ship - Ubuntu 24.04 LTS among them, where WebKitGTK
  # 6.0 only arrives in 24.10. Wails supports GTK 3 behind a build tag, so the
  # tag is chosen from what the machine actually has rather than left as a flag
  # every command has to remember. Passing EXTRA_TAGS explicitly still wins.
  EXTRA_TAGS:
    sh: |
      if [ "$(uname -s)" != "Linux" ]; then echo ""
      elif ! command -v pkg-config >/dev/null 2>&1; then echo ""
      elif pkg-config --exists gtk4 webkitgtk-6.0 2>/dev/null; then echo ""
      elif pkg-config --exists gtk+-3.0 webkit2gtk-4.1 2>/dev/null; then echo "gtk3"
      else echo ""
      fi

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  lint:
    summary: Runs every linter and formatter check across the repository
    cmds:
      - golangci-lint run
      - golangci-lint fmt --diff
      - '{{.PACKAGE_MANAGER}} --dir frontend run lint'
      - '{{.PACKAGE_MANAGER}} --dir frontend run check'

  test:
    summary: Runs every test in the repository
    cmds:
      - go test {{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}./...
      - '{{.PACKAGE_MANAGER}} --dir frontend run test'

  lint:fix:
    summary: Applies every available autofix across the repository
    cmds:
      - golangci-lint fmt
      - golangci-lint run --fix
      - '{{.PACKAGE_MANAGER}} --dir frontend run lint:fix'

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
