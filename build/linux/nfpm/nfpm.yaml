# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

# Regenerating this file with `wails3 task common:update:build-assets` puts
# the template's own defaults back over three of the values below: the version
# becomes a literal 0.0.0 instead of the build's, the vendor becomes "My
# Company", and the homepage becomes wails.io. Check those three after any
# regeneration.
name: "muster"
arch: ${GOARCH}
platform: "linux"
version: "${PRODUCT_VERSION}"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "A local-first desktop task manager over all your Backlog.md projects at once"
vendor: "FMakareev"
homepage: "https://github.com/FMakareev/muster-backlog"
license: "MIT"
release: "1"

contents:
  - src: "./bin/muster"
    dst: "/usr/local/bin/muster"
  # The MCP server. Beside the application, because that is where the
  # connector looks, and shipped at all because the application itself cannot
  # serve the protocol anywhere an agent runs: it links a browser engine.
  - src: "./bin/muster-mcp"
    dst: "/usr/local/bin/muster-mcp"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/muster.png"
  - src: "./build/linux/muster.desktop"
    dst: "/usr/share/applications/muster.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
