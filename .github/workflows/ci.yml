name: ci

# The shared definition of green.
#
# It runs the same three commands a person runs before pushing — `wails3 task
# lint`, `test`, `build` — rather than a separate list that can drift from
# them. A pipeline that checks something else is a pipeline that goes green
# while the machine it is meant to speak for goes red.
#
# One job rather than three. Splitting lint, test and build would run them in
# parallel but pay the setup — apt, Go, Node, two Go tools — three times over,
# and the setup is most of the wall clock here.

on:
  pull_request:
  push:
    branches:
      # Both, because the default branch here is master and a workflow that
      # names the wrong one does not fail — it silently never runs.
      - master
      - main

permissions:
  contents: read

# A new push to the same branch makes the previous run's answer stale.
# Releases are exempt: `main` is where a release commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

env:
  # Pinned, all three. An unpinned tool turns a pipeline red on somebody
  # else's release, which teaches people to ignore it.
  WAILS_VERSION: v3.0.0-beta.8
  GOLANGCI_VERSION: v2.13.1
  # The version the README recommends. It is not needed to build — only to
  # run, and to run the tests.
  BACKLOG_VERSION: 1.50.1
  NODE_VERSION: "24"

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    # Generous against a hang, not a budget. The budget is in the README.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # The Go version comes from go.mod, so CI cannot drift from what the
      # module declares and the README documents.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The pnpm version comes from the packageManager field, for the same
      # reason.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ubuntu-latest has no WebKitGTK 6.0, so this is the GTK 3 path the
      # README documents for Ubuntu 24.04. The build detects which is present
      # and picks the tag itself; nothing here forces it.
      - name: Install the GTK 3 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      # Muster writes only through this CLI, and thirty-eight tests exercise
      # real writes against real projects. Without it they skip, and the
      # pipeline reports green having tested none of them — which is why the
      # test step below also refuses to let them skip.
      - name: Install the Backlog.md CLI
        run: |
          npm install -g "backlog.md@${BACKLOG_VERSION}"
          backlog --version

      # Both are compiled from source and both are slow, so they are cached on
      # the versions above rather than rebuilt every run.
      - name: Cache the Go tools
        id: go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ env.WAILS_VERSION }}-${{ env.GOLANGCI_VERSION }}

      - name: Install the Go tools
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: |
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_VERSION}"

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: wails3 task lint

      # The tests that need the CLI must fail rather than skip here. A green
      # pipeline that quietly tested no writes is worse than a red one.
      - name: Test
        env:
          MUSTER_REQUIRE_BACKLOG_CLI: "1"
        run: wails3 task test

      - name: Build
        run: wails3 task build

      # The build is not proven by producing a file. The version is stamped
      # from build/config.yml through the Taskfile, and a binary that cannot
      # report it is a release nobody can identify afterwards.
      - name: The binary reports its version
        run: |
          expected=$(sed -n 's/^[[:space:]][[:space:]]*version:[[:space:]]*"\(.*\)".*/\1/p' build/config.yml | head -1)
          reported=$(./bin/muster --version)
          echo "build/config.yml says ${expected}"
          echo "the binary says      ${reported}"
          case "${reported}" in
            "muster ${expected} "*) ;;
            *) echo "::error::the binary does not report the version it was built from"; exit 1 ;;
          esac
