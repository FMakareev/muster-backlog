name: ci

# The shared definition of green.
#
# It runs the same three commands a person runs before pushing — `wails3 task
# lint`, `test`, `build` — rather than a separate list that can drift from
# them. A pipeline that checks something else is a pipeline that goes green
# while the machine it is meant to speak for goes red.
#
# One job rather than three. Splitting lint, test and build would run them in
# parallel but pay the setup — apt, Go, Node, two Go tools — three times over,
# and the setup is most of the wall clock here.

on:
  pull_request:
  push:
    branches:
      # The default branch. Naming the wrong one does not fail — the workflow
      # silently never runs — so this has to match the repository.
      - master

permissions:
  contents: read

# A new push to the same branch makes the previous run's answer stale.
# Releases are exempt: `main` is where a release commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  # Pinned, all three. An unpinned tool turns a pipeline red on somebody
  # else's release, which teaches people to ignore it.
  WAILS_VERSION: v3.0.0-beta.8
  GOLANGCI_VERSION: v2.13.1
  # The version the README recommends. It is not needed to build — only to
  # run, and to run the tests.
  BACKLOG_VERSION: 1.50.1
  NODE_VERSION: "24"

jobs:
  check:
    name: lint, test, build
    runs-on: ubuntu-latest
    # Generous against a hang, not a budget. The budget is in the README.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      # The Go version comes from go.mod, so CI cannot drift from what the
      # module declares and the README documents.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # The pnpm version comes from the packageManager field, for the same
      # reason.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # ubuntu-latest has no WebKitGTK 6.0, so this is the GTK 3 path the
      # README documents for Ubuntu 24.04. The build detects which is present
      # and picks the tag itself; nothing here forces it.
      - name: Install the GTK 3 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      # Muster writes only through this CLI, and thirty-eight tests exercise
      # real writes against real projects. Without it they skip, and the
      # pipeline reports green having tested none of them — which is why the
      # test step below also refuses to let them skip.
      - name: Install the Backlog.md CLI
        run: |
          npm install -g "backlog.md@${BACKLOG_VERSION}"
          backlog --version

      # Both land in ~/go/bin and both cost real time to obtain, so they are
      # cached on the versions above rather than fetched every run.
      - name: Cache the Go tools
        id: go-tools
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: go-tools-${{ runner.os }}-${{ env.WAILS_VERSION }}-${{ env.GOLANGCI_VERSION }}

      # The Wails CLI is itself a Wails program: building it runs pkg-config
      # for GTK 4 and WebKitGTK 6.0 unless the gtk3 tag is set, so on a runner
      # with the GTK 3 packages the plain `go install` fails before anything
      # of this project is compiled. The tag is chosen the same way the build
      # chooses it, from what the machine actually has, rather than hardcoded.
      - name: Install the Go tools
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: |
          if pkg-config --exists gtk4 webkitgtk-6.0; then
            tags=""
          elif pkg-config --exists gtk+-3.0 webkit2gtk-4.1; then
            tags="gtk3"
          else
            echo "::error::neither GTK 4 nor GTK 3 development packages are present"
            exit 1
          fi
          echo "building the Wails CLI with tags: ${tags:-none}"
          go install ${tags:+-tags "$tags"} "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"

      # Downloaded, not compiled. `go install` builds a tool with the Go this
      # job takes from go.mod, so the tool's own go directive becomes a floor
      # on this module's: golangci-lint v2.13.0 raised its to 1.26.0 and the
      # install then failed against go.mod's 1.25.0 — "requires go >= 1.26.0"
      # — before a single line of this project was compiled. Pinning an older
      # linter would fix that until the next time it moved. The published
      # binary has no such relationship with this module at all, and it saves
      # the minutes the compile cost.
      #
      # linux-amd64 because this job says ubuntu-latest; the archive is chosen
      # for the runner rather than detected.
      - name: Install golangci-lint
        if: steps.go-tools.outputs.cache-hit != 'true'
        run: |
          version="${GOLANGCI_VERSION#v}"
          name="golangci-lint-${version}-linux-amd64"
          base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_VERSION}"

          work="$(mktemp -d)"
          cd "${work}"
          curl -fsSL -O "${base}/${name}.tar.gz" \
                     -O "${base}/golangci-lint-${version}-checksums.txt"

          # A pinned version names what was meant to arrive. The checksum is
          # what says it did.
          sha256sum --check --ignore-missing "golangci-lint-${version}-checksums.txt"

          tar -xzf "${name}.tar.gz"
          install -D -m 0755 "${name}/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"
          "$(go env GOPATH)/bin/golangci-lint" --version

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: wails3 task lint

      # The tests that need the CLI must fail rather than skip here. A green
      # pipeline that quietly tested no writes is worse than a red one.
      - name: Test
        env:
          MUSTER_REQUIRE_BACKLOG_CLI: "1"
        run: wails3 task test

      - name: Build
        run: wails3 task build

      # The build is not proven by producing a file. The version is stamped
      # from build/config.yml through the Taskfile, and a binary that cannot
      # report it is a release nobody can identify afterwards.
      - name: The binary reports its version
        run: |
          expected=$(sed -n 's/^[[:space:]][[:space:]]*version:[[:space:]]*"\(.*\)".*/\1/p' build/config.yml | head -1)
          reported=$(./bin/muster --version)
          echo "build/config.yml says ${expected}"
          echo "the binary says      ${reported}"
          case "${reported}" in
            "muster ${expected} "*) ;;
            *) echo "::error::the binary does not report the version it was built from"; exit 1 ;;
          esac
