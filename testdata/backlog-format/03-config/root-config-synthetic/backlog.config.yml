# SYNTHETIC. Not taken from the corpus.
# backlog 1.48.0 also supports a config file at the PROJECT ROOT named backlog.config.yml
# (`backlog init --config-location root`). It carries the same keys, plus backlog_directory,
# which relocates the data folder to an arbitrary project-relative path.
project_name: "root-config-project"
backlog_directory: "ops/planning"
default_status: "To Do"
statuses: ["To Do", "In Progress", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
