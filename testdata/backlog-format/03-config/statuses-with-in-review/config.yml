project_name: "muster-backlog"
default_status: "To Do"
statuses: ["To Do", "In Progress", "In Review", "Done"]
labels: []
date_format: yyyy-mm-dd
max_column_width: 20
auto_open_browser: true
default_port: 6420
remote_operations: true
auto_commit: false
filesystem_only: false
bypass_git_hooks: false
check_active_branches: true
active_branch_days: 30
task_prefix: "task"
definition_of_done:
  - "Linters and formatters pass across Go and frontend"
  - "Automated tests cover the change and the suite is green"
  - "User-facing behaviour change is reflected in README or docs"
  - "Commits follow Conventional Commits and are scoped to this task"
